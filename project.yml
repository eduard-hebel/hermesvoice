name: HermesVoice
options:
  bundleIdPrefix: de.hermes
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "1.0.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  HermesVoice:
    type: application
    platform: macOS
    sources:
      - Sources/HermesVoice
    info:
      path: Sources/HermesVoice/Info.plist
      properties:
        CFBundleDisplayName: HermesVoice
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true # Menubar-Only, kein Dock-Icon
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "HermesVoice braucht Mikrofon-Zugriff um deine Spracheingabe aufzunehmen und lokal mit Whisper zu transkribieren."
        NSHumanReadableCopyright: "© 2026 Eduard Tatar"
    entitlements:
      path: Sources/HermesVoice/HermesVoice.entitlements
      properties:
        com.apple.security.app-sandbox: false # Accessibility-API braucht non-sandboxed
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true # Für Cleanup-API + WhisperKit-Model-Download
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hermes.voice
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
