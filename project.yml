name: HermesVoice
options:
  bundleIdPrefix: de.hermes
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: ""

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "1.0.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  HermesVoice:
    type: application
    platform: macOS
    sources:
      - path: Sources/HermesVoice
        excludes:
          - "*.entitlements"
      - path: Sources/HermesCore
    info:
      path: Sources/HermesVoice/Info.plist
      properties:
        CFBundleDisplayName: HermesVoice
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSUIElement: true # Menubar-Only, kein Dock-Icon
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "HermesVoice braucht Mikrofon-Zugriff um deine Spracheingabe aufzunehmen und lokal mit Whisper zu transkribieren."
        NSHumanReadableCopyright: "© 2026 Eduard Tatar"
    entitlements:
      path: Sources/HermesVoice/HermesVoice.entitlements
      properties:
        com.apple.security.app-sandbox: false # Accessibility-API braucht non-sandboxed
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true # Für Cleanup-API + WhisperKit-Model-Download
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hermes.voice
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO

  HermesVoiceiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/HermesVoiceiOS
      - path: Sources/HermesCore
      # On-device Whisper-Modell IN die App gebundelt (Ordner-Referenz, 1:1 kopiert) →
      # kein HuggingFace-Download beim Erststart, sofortiger Start, offline.
      - path: Models/openai_whisper-large-v3-v20240930_turbo_632MB
        type: folder
        buildPhase: resources
    info:
      path: Sources/HermesVoiceiOS/Info.plist
      properties:
        CFBundleDisplayName: HermesVoice
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "HermesVoice braucht Mikrofon-Zugriff, um deine Spracheingabe aufzunehmen und lokal mit Whisper zu transkribieren."
        CFBundleURLTypes:
          - CFBundleURLName: de.hermes.voice.ios
            CFBundleURLSchemes: [hermes]
    entitlements:
      path: Sources/HermesVoiceiOS/HermesVoiceiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.hermes.voice.shared
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - target: HermesKeyboard   # Tastatur-Erweiterung wird in die App eingebettet
      - target: HermesShare      # Medien aus dem iOS-Teilen-Menue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hermes.voice.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HermesKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Nur die Tastatur selbst + kleiner App-Group-Briefkasten — KEIN WhisperKit und
      # kein Modell. Die schwere Transkription bleibt in der Haupt-App.
      - path: Sources/HermesKeyboard
        excludes:
          - "*.entitlements"
          - "Info.plist"
      - path: Sources/HermesCore/PendingStore.swift
    info:
      path: Sources/HermesKeyboard/Info.plist
      properties:
        CFBundleDisplayName: HermesVoice
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: de-DE
            RequestsOpenAccess: true
    entitlements:
      path: Sources/HermesKeyboard/HermesKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.hermes.voice.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hermes.voice.ios.keyboard
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "5.10"

  HermesShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/HermesShare
        excludes:
          - "*.entitlements"
      # Nur der atomare App-Group-Briefkasten. Kein HermesCore, kein WhisperKit,
      # kein 632-MB-Modell in der Share Extension.
      - path: Sources/HermesCore/SharedImportInbox.swift
    info:
      path: Sources/HermesShare/Info.plist
      properties:
        CFBundleDisplayName: In HermesVoice importieren
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    entitlements:
      path: Sources/HermesShare/HermesShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.hermes.voice.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hermes.voice.ios.share
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "5.10"

  HermesVoiceTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/HermesVoiceTests
    dependencies:
      - target: HermesVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hermes.voice.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
